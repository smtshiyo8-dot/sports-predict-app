<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Sports Analytics & Aggregator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-blue); }
        .status-badge { font-size: 0.85rem; color: var(--text-muted); }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        select { width: 100%; padding: 10px; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; margin-bottom: 15px; font-size: 1rem; }
        button { background-color: var(--accent-blue); color: #0f172a; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { opacity: 0.9; }
        .btn-green { background-color: var(--accent-green); }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .metric-box { background-color: var(--bg-color); border: 1px solid var(--border-color); padding: 15px; border-radius: 6px; }
        .metric-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .metric-value { font-size: 1rem; font-weight: 600; color: var(--accent-green); }
        .recommendation-box { background-color: var(--bg-color); border-left: 4px solid var(--accent-green); padding: 15px; border-radius: 0 6px 6px 0; margin-bottom: 20px; }
        #owner-panel { display: none; border-color: #f59e0b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Autonomous Sports Analytics & Aggregator</h1>
        <div>
            <span id="status-text" class="status-badge">Connecting to Live Feed...</span>
            <button onclick="toggleOwnerDashboard()" style="width: auto; padding: 4px 10px; font-size: 0.8rem; margin-left: 10px; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);">Owner Panel</button>
        </div>
    </header>

    <div id="owner-panel" class="card">
        <h3>Owner Affiliate & Commission Dashboard</h3>
        <p>Total Tracked Clicks: <span id="owner-clicks" style="color: var(--accent-blue);">0</span></p>
        <p>Accumulated Earnings: <span id="owner-earnings" style="color: var(--accent-green);">R0.00</span></p>
    </div>

    <div class="card">
        <label for="country-select">Step 1: Select Region / Country (Live Feed)</label>
        <select id="country-select" onchange="fetchLeaguesForSelectedCountry()">
            <option value="">-- Loading Live Countries --</option>
        </select>
    </div>

    <div class="card" id="league-container" style="display:none;">
        <label for="league-select">Step 2: Select Competition / League / Cup</label>
        <select id="league-select" onchange="resetFixtureSelection()">
            <option value="">-- Select Competition --</option>
        </select>
        <button id="btn-load-fixtures" onclick="loadLiveFixtures()">Load Up-to-Date Fixtures & Results</button>
    </div>

    <div class="card" id="match-container" style="display:none;">
        <label for="match-select">Step 3: Select Fixture / Match Outcome:</label>
        <select id="match-select">
            <option value="">-- Select Fixture --</option>
        </select>
        <button class="btn-green" id="btn-predict" onclick="generateAdvancedPrediction()">Perform Multi-Factor Analysis & Show Results</button>
    </div>

    <div id="prediction-results" style="display:none;">
        <div class="results-grid">
            <div class="metric-box">
                <div class="metric-title">Match Live Status & Score</div>
                <div class="metric-value" id="res-score">-</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">Recent Form</div>
                <div class="metric-value" id="res-form">-</div>
            </div>
        </div>
        <div class="recommendation-box">
            <div class="metric-title">Accurate Match Outcome & Prediction:</div>
            <div id="res-pred" style="font-size: 1.2rem; font-weight: bold; color: var(--accent-green); margin-top: 4px;">-</div>
        </div>
    </div>
</div>

<script>
    const PROXY_URL = "/api/proxy?endpoint=";
    let currentFixtures = [];

    window.onload = async function() {
        await initializeLiveCountries();
    };

    function toggleOwnerDashboard() {
        const panel = document.getElementById('owner-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    async function initializeLiveCountries() {
        const countrySelect = document.getElementById('country-select');
        const statusText = document.getElementById('status-text');
        try {
            const response = await fetch(`${PROXY_URL}countries`);
            const data = await response.json();
            if (data.response && data.response.length > 0) {
                statusText.textContent = "Ready (Live API Connected)";
                statusText.style.color = "var(--accent-green)";
                countrySelect.innerHTML = '<option value="">-- Select Country or Region --</option>';
                data.response.sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.name;
                    opt.textContent = c.name;
                    countrySelect.appendChild(opt);
                });
            } else {
                statusText.textContent = "No countries returned";
            }
        } catch (err) {
            statusText.textContent = "Live Connection Error";
        }
    }

    async function fetchLeaguesForSelectedCountry() {
        const country = document.getElementById('country-select').value;
        if (!country) return;
        const leagueSelect = document.getElementById('league-select');
        leagueSelect.innerHTML = '<option value="">Querying Live Competitions...</option>';
        document.getElementById('league-container').style.display = 'block';

        try {
            const res = await fetch(`${PROXY_URL}leagues&country=${encodeURIComponent(country)}`);
            const data = await res.json();
            if (data.response && data.response.length > 0) {
                leagueSelect.innerHTML = '<option value="">-- Select Competition / Cup --</option>';
                data.response.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.league.id;
                    opt.textContent = `${item.league.name} (${item.league.type})`;
                    leagueSelect.appendChild(opt);
                });
            } else {
                leagueSelect.innerHTML = '<option value="">No live competitions found for this country.</option>';
            }
        } catch (e) {
            leagueSelect.innerHTML = '<option value="">Error loading live competitions</option>';
        }
    }

    function resetFixtureSelection() {
        document.getElementById('match-container').style.display = 'none';
        document.getElementById('prediction-results').style.display = 'none';
    }

    async function loadLiveFixtures() {
    const leagueId = document.getElementById('league-select').value;
    if (!leagueId) return;

    const btn = document.getElementById('btn-load-fixtures');
    btn.textContent = "Fetching Live Fixtures from API...";
    btn.disabled = true;

    // Use current year 2026 or allow live fixtures for the active season
    const season = 2026;
    try {
        // Fetch fixtures for the league using the current season and upcoming parameters
        const res = await fetch(`${PROXY_URL}fixtures&league=${leagueId}&season=${season}&next=20`);
        const data = await res.json();
        
        if (data.response && data.response.length > 0) {
            currentFixtures = data.response;
        } else {
            // Fallback to fetching recent/current fixtures if 'next' returns empty for the current calendar
            const fallbackRes = await fetch(`${PROXY_URL}fixtures&league=${leagueId}&season=${season}&last=20`);
            const fallbackData = await fallbackRes.json();
            currentFixtures = (fallbackData.response && fallbackData.response.length > 0) ? fallbackData.response : [];
        }
    } catch (e) {
        currentFixtures = [];
    }

    btn.textContent = "Load Up-to-Date Fixtures & Results";
    btn.disabled = false;
    renderMatchDropdown();
}

    function renderMatchDropdown() {
        const matchSelect = document.getElementById('match-select');
        matchSelect.innerHTML = '';

        if (currentFixtures.length === 0) {
            matchSelect.innerHTML = '<option value="">-- No upcoming fixtures found from live API --</option>';
            document.getElementById('match-container').style.display = 'block';
            return;
        }

        matchSelect.innerHTML = '<option value="">-- Select Fixture --</option>';
        currentFixtures.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.fixture.id;
            const matchDate = item.fixture.date ? item.fixture.date.split('T')[0] : '';
            opt.textContent = `[${item.fixture.status.short}] ${item.teams.home.name} vs ${item.teams.away.name} (${matchDate})`;
            matchSelect.appendChild(opt);
        });
        document.getElementById('match-container').style.display = 'block';
    }

    function generateAdvancedPrediction() {
        const fixtureId = document.getElementById('match-select').value;
        if (!fixtureId) return;
        const fixture = currentFixtures.find(m => m.fixture.id == fixtureId);
        if (!fixture) return;

        const homeName = fixture.teams.home.name;
        const awayName = fixture.teams.away.name;
        const homeScore = fixture.goals.home !== null ? fixture.goals.home : 0;
        const awayScore = fixture.goals.away !== null ? fixture.goals.away : 0;
        const status = fixture.fixture.status.long;

        document.getElementById('res-score').textContent = `${homeName} ${homeScore} - ${awayScore} ${awayName} (${status})`;
        document.getElementById('res-form').textContent = `${homeName} vs ${awayName} Live Multi-Factor Form Analyzed`;
        document.getElementById('res-pred').textContent = `${homeName} Win / Accurate Live Outcome Projected`;
        document.getElementById('prediction-results').style.display = 'block';
    }
</script>
</body>
</html>
