<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Sports Analytics & Live Fixtures</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-gold: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            color: var(--accent-blue);
            font-size: 1.8rem;
        }

        header p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            color: var(--accent-blue);
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        select, button, input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }

        button.analyze-btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border: none;
            transition: 0.2s;
        }

        button.analyze-btn:hover {
            background-color: #7dd3fc;
        }

        .result-box {
            display: none;
            background-color: #0f172a;
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-value {
            font-weight: bold;
            color: var(--accent-green);
        }

        .affiliate-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed var(--border-color);
            text-align: center;
        }

        .affiliate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .affiliate-btn {
            display: block;
            padding: 12px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>GLOBAL SPORTS & AI ANALYTICS</h1>
        <p>Live Global Fixtures & Predictive Probability Engine</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Live Match Predictor</h2>
            
            <div class="form-group">
                <label for="league-select">Select Global League:</label>
                <select id="league-select">
                    <option value="PL">English Premier League (UK)</option>
                    <option value="CL">UEFA Champions League</option>
                    <option value="PD">Spanish La Liga</option>
                    <option value="SA">Italian Serie A</option>
                    <option value="BL1">German Bundesliga</option>
                    <option value="FL1">French Ligue 1</option>
                </select>
            </div>

            <button class="analyze-btn" onclick="fetchLiveFixtures()">Load Live Upcoming Matches</button>

            <div class="form-group" id="match-container" style="margin-top: 15px; display: none;">
                <label for="match-select">Select Upcoming Fixture:</label>
                <select id="match-select"></select>
                <button class="analyze-btn" id="btn-predict" style="background-color: var(--accent-green);" onclick="generatePrediction()">Generate AI Prediction</button>
            </div>

            <div id="prediction-results" class="result-box">
                <div class="stat-row"><span>Head-to-Head Record:</span> <span class="stat-value" id="res-h2h">Analyzing...</span></div>
                <div class="stat-row"><span>Goal Expectancy:</span> <span class="stat-value" id="res-goals">Analyzing...</span></div>
                <div class="stat-row"><span>Algorithmic Recommendation:</span> <span class="stat-value" id="res-pred" style="color: var(--accent-gold);">Analyzing...</span></div>

                <div class="affiliate-section">
                    <h3 style="color: var(--accent-gold); margin: 0 0 10px 0;">Place Your Bet with Licensed Partners:</h3>
                    <div class="affiliate-grid">
                        <a href="https://www.betway.com" id="link-betway" target="_blank" class="affiliate-btn">Bet on Betway ➔</a>
                        <a href="https://www.hollywoodbets.net" id="link-hollywood" target="_blank" class="affiliate-btn">Bet on Hollywoodbets ➔</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_KEY = "dcd98e1c2abe4aec8878296345a9efd0";
        let currentFixtures = [];

        async function fetchLiveFixtures() {
            const leagueCode = document.getElementById('league-select').value;
            const proxyUrl = 'https://corsproxy.io/?';
            const apiUrl = encodeURIComponent(`https://api.football-data.org/v4/competitions/${leagueCode}/matches?status=SCHEDULED`);

            try {
                const response = await fetch(proxyUrl + apiUrl, {
                    method: 'GET',
                    headers: { 'X-Auth-Token': API_KEY }
                });

                const data = await response.json();
                
                if (data.errorCode || data.message) {
                    alert("API Note: " + (data.message || "Error fetching matches."));
                    return;
                }

                currentFixtures = data.matches || [];
                const matchSelect = document.getElementById('match-select');
                matchSelect.innerHTML = '';

                if (currentFixtures.length === 0) {
                    alert("No upcoming scheduled matches found for this league right now.");
                    return;
                }

                currentFixtures.slice(0, 15).forEach((item) => {
                    const option = document.createElement('option');
                    option.value = item.id; // Store actual match ID
                    const matchDate = new Date(item.utcDate).toLocaleDateString();
                    option.textContent = `${item.homeTeam.name} vs ${item.awayTeam.name} (${matchDate})`;
                    matchSelect.appendChild(option);
                });

                document.getElementById('match-container').style.display = 'block';

            } catch (error) {
                console.error(error);
                alert("Connection status check: Please verify connection.");
            }
        }

        async function generatePrediction() {
            const matchId = document.getElementById('match-select').value;
            const fixture = currentFixtures.find(m => m.id == matchId);

            if (!fixture) return;

            const btn = document.getElementById('btn-predict');
            btn.textContent = "Fetching Live H2H Analytics...";
            btn.disabled = true;

            const homeName = fixture.homeTeam.name;
            const awayName = fixture.awayTeam.name;

            const proxyUrl = 'https://corsproxy.io/?';
            const apiUrl = encodeURIComponent(`https://api.football-data.org/v4/matches/${matchId}/head2head?limit=10`);

            try {
                const response = await fetch(proxyUrl + apiUrl, {
                    method: 'GET',
                    headers: { 'X-Auth-Token': API_KEY }
                });

                const data = await response.json();
                const h2h = data.aggregates || data.head2head;

                let homeWins = 0;
                let awayWins = 0;
                let draws = 0;
                let totalMatches = 0;
                let totalGoals = 0;

                if (h2h) {
                    homeWins = h2h.homeTeam ? h2h.homeTeam.wins : (h2h.numberOfMatches ? h2h.homeTeamWins : 0);
                    awayWins = h2h.awayTeam ? h2h.awayTeam.wins : (h2h.numberOfMatches ? h2h.awayTeamWins : 0);
                    draws = h2h.draws !== undefined ? h2h.draws : 0;
                    totalMatches = h2h.numberOfMatches || (homeWins + awayWins + draws);
                    totalGoals = h2h.totalGoals || 0;
                }

                // If no direct H2H history exists in the free plan response, fallback to realistic base calculation
                if (totalMatches === 0) {
                    document.getElementById('res-h2h').textContent = `${homeName} vs ${awayName} (Limited H2H History)`;
                    document.getElementById('res-goals').textContent = `Over 1.5 Goals (Estimated 65%)`;
                    document.getElementById('res-pred').textContent = `${homeName} or Draw (Home Advantage)`;
                } else {
                    const homeWinPct = Math.round((homeWins / totalMatches) * 100);
                    const awayWinPct = Math.round((awayWins / totalMatches) * 100);
                    const drawPct = 100 - homeWinPct - awayWinPct;
                    const avgGoals = (totalGoals / totalMatches).toFixed(1);

                    let recommendation = "";
                    if (homeWinPct >= 50) {
                        recommendation = `${homeName} Win or Draw (Double Chance)`;
                    } else if (awayWinPct >= 50) {
                        recommendation = `${awayName} Win or Draw (Double Chance)`;
                    } else {
                        recommendation = "Both Teams To Score / Over 1.5 Goals";
                    }

                    document.getElementById('res-h2h').textContent = `Past ${totalMatches} games: ${homeName} (${homeWins}W) | ${awayName} (${awayWins}W) | Draws (${draws})`;
                    document.getElementById('res-goals').textContent = `Avg ${avgGoals} goals/match (${avgGoals > 2.0 ? 'High' : 'Moderate'} scoring potential)`;
                    document.getElementById('res-pred').textContent = recommendation;
                }

                document.getElementById('prediction-results').style.display = 'block';

            } catch (error) {
                console.error(error);
                alert("Error retrieving H2H data from API.");
            } finally {
                btn.textContent = "Generate AI Prediction";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
